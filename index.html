<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickBite Queue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <div class="top-bar">
      <div class="logo">🍽️ QuickBite</div>
      <button id="themeToggle">🌙</button>
    </div>

    <h1>Reserve & Order</h1>

    <select id="restaurantSelect">
      <option value="">Select Restaurant</option>
      <option>Spice Hub</option>
      <option>Burger Point</option>
      <option>Pizza Corner</option>
      <option>Chaat Junction</option>
    </select>

    <button id="orderBtn">Place Order</button>

    <div class="card">
      <p>Your Token</p>
      <h2 id="current">None</h2>
    </div>

    <div class="info">
      <p>Status: <span id="status">Waiting</span></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
