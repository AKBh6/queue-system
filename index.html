<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Stall Queue System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Food Stall Queue System</h1>

    <div class="card">
      <p>Current Token</p>
      <h2 id="current">None</h2>
    </div>

    <div class="buttons">
      <button id="generateBtn">Generate Token</button>
      <button id="serveBtn">Serve Next</button>
      <button id="resetBtn">Reset</button>
    </div>

    <div class="info">
      <p>Total Waiting: <span id="waiting">0</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
