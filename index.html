<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickBite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header>
      <div class="logo">
        <div class="logo-icon">QB</div>
        <h1>QuickBite</h1>
      </div>
      <button id="themeToggle" class="theme-btn">Dark</button>
    </header>

    <section class="restaurants">
      <h2>Select Restaurant</h2>

      <div class="restaurant-grid">
        <div class="restaurant-card" data-name="Spice Hub">Spice Hub</div>
        <div class="restaurant-card" data-name="Burger Point">Burger Point</div>
        <div class="restaurant-card" data-name="Pizza Corner">Pizza Corner</div>
        <div class="restaurant-card" data-name="Chaat Junction">Chaat Junction</div>
      </div>
    </section>

    <section class="order-section">
      <button id="orderBtn" disabled>Place Order</button>

      <div class="token-card">
        <p>Your Token</p>
        <h2 id="tokenDisplay">--</h2>
        <span id="statusDisplay">No Active Order</span>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
